$kind: http-request
name: GET test
url: https://jsonplaceholder.typicode.com/users
method: GET
body:
  type: json
  content: "{\r

    \    \"name\": \"Jose\",\r

    \    \"email\": \"jose@test.com\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"First item validation\", function () {\r

      \r

      \    let firstItem = pm.response.json()[0];\r

      \    //console.log(firstItem);\r

      \    pm.expect(firstItem.name).to.equal('Leanne Graham');\r

      \r

      });\r

      \r

      pm.test(\"Sixth item validation\", function () {\r

      \r

      \    pm.expect(pm.response.json()[5].address.city).to.equal('South Christy');\r

      \r

      });\r

      \r

      pm.test(\"Users have a name, not empty\", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    body.forEach(user => {\r

      \        pm.expect(user.name).to.not.be.empty;\r

      \    });\r

      });\r

      \r

      pm.test(\"Users have an id\", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    body.forEach(user => {\r

      \        pm.expect(user.id).to.exist;\r

      \    });\r

      });\r

      \r

      pm.test(\"Users have a @ in the email email \", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    body.forEach(user => {\r

      \        pm.expect(user.email).to.include(\"@\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Users have valid email format \", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    body.forEach(user => {\r

      \        pm.expect(user.email.split(\"@\")[1]).to.include(\".\");\r

      \    });\r

      });\r

      \r

      pm.test(\"Username is not empty\", function () {\r

      \    const body = pm.response.json();\r

      \r

      \    body.forEach(user => {\r

      \        pm.expect(user.username).to.not.be.empty;\r

      \    });\r

      });\r

      \r

      pm.test(\"The array returns 10 element\", function () {\r

      \    const body = pm.response.json();\r

      \    pm.expect(body.length).to.equal(10);\r

      });\r

      \r

      pm.test(\"IDs are unique\", function () {\r

      \    const users = pm.response.json();\r

      \r

      \    const ids = users.map(user => user.id);\r

      \    const uniqueIds = [...new Set(ids)];\r

      \r

      \    pm.expect(ids.length).to.equal(uniqueIds.length);\r

      });\r

      \r

      pm.test(\"Emails are unique\", function () {\r

      \    const users = pm.response.json();\r

      \r

      \    const emails = users.map(user => user.email);\r

      \    const uniqueEmails = [...new Set(emails)];\r

      \r

      \    pm.expect(emails.length).to.equal(uniqueEmails.length);\r

      });\r

      \r

      pm.test(\"All users have a complete structure\", function () {\r

      \    const body = pm.response.json();\r

      \    body.forEach(user => {\r

      \        pm.expect(user).to.have.all.keys(\r

      \            \"id\",\r

      \            \"name\",\r

      \            \"username\",\r

      \            \"email\",\r

      \            \"address\",\r

      \            \"phone\",\r

      \            \"website\",\r

      \            \"company\"\r

      \        );\r

      \    });\r

      });"
    language: text/javascript
